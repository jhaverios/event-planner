<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Door — Jhaveri Securities</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* The door is used one-handed, at arm's length, in a queue. Everything is
     bigger than the rest of the portal and nothing needs a second tap. */
  .scan { position: relative; border-radius: var(--radius-lg); overflow: hidden;
          background: #000; aspect-ratio: 4/3; margin-bottom: 14px; }
  .scan video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scan .frame { position: absolute; inset: 14%; border: 3px solid rgba(255,255,255,.75);
                 border-radius: 12px; pointer-events: none; }
  .verdict { border-radius: var(--radius-lg); padding: 20px; text-align: center; margin-bottom: 14px; }
  .verdict .big { font-size: var(--t-hero); font-weight: 650; line-height: 1.15; }
  .verdict .nm  { font-size: var(--t-xl); margin-top: 6px; }
  .verdict .sub { font-size: var(--t-sm); color: var(--muted); margin-top: 6px; }
  .verdict.ok   { background: var(--tint-pos); border: 1px solid #cfe2d6; }
  .verdict.ok .big { color: var(--pos); }
  .verdict.dup  { background: var(--tint-warn); border: 1px solid #ecdcb2; }
  .verdict.dup .big { color: var(--amber); }
  .verdict.bad  { background: var(--tint-neg); border: 1px solid #eed3c9; }
  .verdict.bad .big { color: var(--neg); }
  .tally { display: flex; gap: 10px; }
  .tally .fig { flex: 1; text-align: center; }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">Door</span>
  <span class="who" id="who"></span>
</header>

<main class="main" style="max-width:520px">
  <div id="boot" class="note">Loading…</div>

  <div id="body" hidden>
    <div class="pagehead"><h1>Check in</h1></div>
    <p class="denom">Scan the guest's QR, or type the reference from their message.</p>
    <div class="field">
      <label for="list">Entrance</label>
      <select id="list"></select>
    </div>

    <div class="tally figs" id="tally"></div>

    <div id="verdict"></div>

    <div class="scan" id="scanBox" hidden><video id="v" playsinline muted></video><div class="frame"></div></div>
    <button class="btn" id="camBtn" type="button" style="width:100%;margin-bottom:14px">Start camera</button>

    <div class="card">
      <h2>Or type the reference</h2>
      <form id="manual">
        <div class="field" style="margin-bottom:10px">
          <input type="text" id="code" placeholder="MKXUT" autocomplete="off"
                 autocapitalize="characters" spellcheck="false"
                 style="text-transform:uppercase;letter-spacing:.1em;font-size:var(--t-xl);text-align:center">
        </div>
        <button class="btn gold" type="submit" style="width:100%">Check in</button>
      </form>
      <div class="hint">The reference is printed in the guest's WhatsApp message. Use this when a code will not scan.</div>
    </div>
  </div>
</main>

<script src="/assets/app.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  let stream = null, detector = null, loop = null, busy = false;
  let seen = { in: 0, dup: 0, bad: 0 };
  const recent = new Map();  // secret -> time, so one code held up to the lens
                             // does not fire fifty times a second.

  function tally() {
    $('tally').innerHTML = [
      ['Checked in', seen.in, 'good'],
      ['Already in', seen.dup, seen.dup ? 'opp' : ''],
      ['Rejected', seen.bad, seen.bad ? 'warn' : '']
    ].map(([k, v, c]) => `<div class="fig"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join('');
  }

  function show(kind, big, name, sub) {
    $('verdict').innerHTML = `<div class="verdict ${kind}">
      <div class="big">${JSL.esc(big)}</div>
      ${name ? `<div class="nm">${JSL.esc(name)}</div>` : ''}
      ${sub ? `<div class="sub">${JSL.esc(sub)}</div>` : ''}</div>`;
    if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 60 : [50, 60, 50]);
  }

  async function submit(code) {
    if (busy || !code) return;
    busy = true;
    try {
      const r = await JSL.post('/api/checkin', { code, list_id: +$('list').value });
      const who = (r.position && r.position.attendee_name) || '';
      if (r.status === 'ok') { seen.in++; show('ok', 'Welcome', who, 'Checked in'); }
      else if (r.reason === 'already_redeemed') {
        seen.dup++; show('dup', 'Already checked in', who, 'This pass has been used once already');
      } else if (r.reason === 'not_found') {
        seen.bad++; show('bad', 'Not found', '', 'No registration matches that. Check the spelling, or look them up on the dashboard.');
      } else if (r.reason === 'ambiguous') {
        seen.bad++; show('bad', 'More than one match', '',
          (r.matches || []).map(m => m.name + ' (' + m.order + ')').join(', '));
      } else {
        seen.bad++; show('bad', 'Rejected', who, r.reason || 'Unknown reason');
      }
    } catch (e) {
      seen.bad++; show('bad', 'Could not reach the server', '', e.message);
    } finally {
      tally(); busy = false;
    }
  }

  $('manual').addEventListener('submit', e => {
    e.preventDefault();
    const c = $('code').value.trim().toUpperCase();
    $('code').value = '';
    submit(c);
  });

  // --- camera --------------------------------------------------------------
  $('camBtn').addEventListener('click', async () => {
    if (stream) return stopCam();
    if (!('BarcodeDetector' in window)) {
      show('bad', 'This browser cannot scan',
        '', 'Use pretixSCAN, or type the reference below. Camera scanning needs a Chromium-based browser.');
      return;
    }
    try {
      detector = new BarcodeDetector({ formats: ['qr_code'] });
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' } });
      $('v').srcObject = stream;
      await $('v').play();
      $('scanBox').hidden = false;
      $('camBtn').textContent = 'Stop camera';
      loop = setInterval(tick, 220);
    } catch (e) {
      show('bad', 'Camera unavailable', '', e.message + ' — type the reference instead.');
      stopCam();
    }
  });

  function stopCam() {
    if (loop) clearInterval(loop), loop = null;
    if (stream) stream.getTracks().forEach(t => t.stop()), stream = null;
    $('scanBox').hidden = true;
    $('camBtn').textContent = 'Start camera';
  }

  async function tick() {
    if (busy || !detector || $('v').readyState < 2) return;
    let codes = [];
    try { codes = await detector.detect($('v')); } catch (e) { return; }
    if (!codes.length) return;
    const raw = (codes[0].rawValue || '').trim();
    const now = Date.now();
    if (recent.get(raw) && now - recent.get(raw) < 4000) return;
    recent.set(raw, now);
    submit(raw);
  }

  window.addEventListener('pagehide', stopCam);

  // --- boot ----------------------------------------------------------------
  (async function () {
    try {
      const s = await JSL.get('/api/session');
      $('who').innerHTML = `<b>${JSL.esc(s.display_name)}</b>door staff`;
      const lists = await JSL.get('/api/checkinlists');
      if (!lists.length) {
        $('boot').className = 'note warn';
        $('boot').textContent = 'No check-in list has been set up yet.';
        return;
      }
      $('list').innerHTML = lists.map(l =>
        `<option value="${l.id}">${JSL.esc(l.name)}</option>`).join('');
      tally();
      $('boot').hidden = true;
      $('body').hidden = false;
      $('code').focus();
    } catch (e) {
      $('boot').className = 'note bad';
      $('boot').textContent = e.message;
    }
  })();
})();
</script>
</body>
</html>
