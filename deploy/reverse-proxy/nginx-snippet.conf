# Use this when jprod already runs nginx for the other jslwealth.in sites.
# Do NOT start the stack's own Caddy in that case; deploy-jprod.sh detects
# this and skips it automatically.
#
#   sudo cp nginx-snippet.conf /etc/nginx/sites-available/event-planner
#   sudo ln -s /etc/nginx/sites-available/event-planner /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d events.jslwealth.in -d flow.jslwealth.in
#
# certbot rewrites these blocks to add the TLS listeners and redirects.

server {
    listen 80;
    server_name events.jslwealth.in;

    # Ticket PDFs and brochure attachments; the default 1m is too small.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8345;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name flow.jslwealth.in;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # n8n's editor uses websockets for live execution updates.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
