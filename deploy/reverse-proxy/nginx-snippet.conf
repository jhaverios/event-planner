# jprod already runs nginx for the other jslwealth.in sites (atlas, clients,
# global, rebalance, golddesk, jhaveri-pm), so it owns 80 and 443 and the
# stack's own Caddy must NOT be started. deploy-jprod.sh detects this and
# skips Caddy automatically; this file is the other half.
#
#   sudo cp nginx-snippet.conf /etc/nginx/sites-available/event-planner
#   sudo ln -s /etc/nginx/sites-available/event-planner /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d events.jslwealth.in -d tickets.jslwealth.in
#
# certbot rewrites these blocks to add the TLS listeners and the redirect.
#
# Two names, on purpose. The portal and pretix cannot share one hostname
# because both answer on /api: the portal serves /api/register and /api/stats,
# pretix serves /api/v1. Splitting by path would mean maintaining a list of
# pretix's URL prefixes and finding out we got it wrong at a door.
#
# n8n is deliberately NOT published. It holds the API credentials for pretix,
# WATI and ZeptoMail, and only ever needs an administrator, so it stays on
# loopback and is reached through an SSH tunnel:
#
#   ssh -N -L 5678:127.0.0.1:5678 ubuntu@jprod    then http://localhost:5678

# --- What brokers, admins and door staff open -----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name events.jslwealth.in;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# --- What pretixSCAN and the pretix control panel talk to -----------------
server {
    listen 80;
    listen [::]:80;
    server_name tickets.jslwealth.in;

    # Ticket PDFs and event brochure attachments; nginx's default 1m is too
    # small for a two-page PDF with images.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8345;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # pretix generates ticket PDFs on request; a slow one must not 504.
        proxy_read_timeout 300s;
    }
}
