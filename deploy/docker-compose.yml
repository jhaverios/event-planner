# JSL Wealth event portal — single-host stack for jprod.
#
# Two ways to run it:
#   A) jprod already has nginx/Traefik/Caddy on :80/:443
#        docker compose up -d
#      Then point the existing proxy at 127.0.0.1:8345 (pretix) and 127.0.0.1:5678 (n8n).
#      See ../deploy/reverse-proxy/nginx-snippet.conf.
#   B) nothing is listening on :80/:443
#        docker compose --profile edge up -d
#      Caddy takes both ports and gets Let's Encrypt certificates automatically.
#
# Run scripts/preflight.sh on jprod first — it tells you which case you are in.

name: jsl-events

services:
  postgres:
    # n8n reports Postgres 16 as "outside the supported range" and pretix needs
    # 14 or newer, so 17 is the version that satisfies both.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      PRETIX_DB_PASSWORD: ${PRETIX_DB_PASSWORD:?set PRETIX_DB_PASSWORD in .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    # Loopback only, never the public interface. Needed so the directory CSV
    # importer and ad-hoc reporting can reach the cluster from the host.
    # 5433 is deliberately avoided: jprod already publishes another postgres
    # there (niyam-db-1), and on 0.0.0.0 rather than loopback.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  portal:
    # The screens brokers, admins and door staff actually use. Everything a
    # human waits on happens here; anything on a clock stays in n8n.
    build: ../portal
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PRETIX_API_BASE: ${PRETIX_API_BASE:-http://pretix:80/api/v1}
      PRETIX_HOST: ${PRETIX_HOST:-${PRETIX_DOMAIN}}
      # Empty on a first deploy: the token cannot exist until pretix itself is
      # set up. The portal says so plainly rather than failing to boot.
      PRETIX_API_TOKEN: ${PRETIX_API_TOKEN:-}
      PRETIX_ORGANIZER: ${PRETIX_ORGANIZER:-jsl}
      PRETIX_EVENT: ${PRETIX_EVENT:-investor-events}
      DIRECTORY_DSN: ${DIRECTORY_DSN:-postgresql://directory:${DIRECTORY_DB_PASSWORD:-}@postgres:5432/directory}
      BROKER_LINK_SECRET: ${BROKER_LINK_SECRET:?set BROKER_LINK_SECRET}
      # Admins sign in; brokers never do. Unset means the admin page says so
      # rather than silently letting anyone in.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WATI_API_BASE: ${WATI_API_BASE:-}
      WATI_TOKEN: ${WATI_TOKEN:-}
      WATI_TEMPLATE: ${WATI_TEMPLATE:-jsl_event_v3}
      ZEPTO_API_KEY: ${ZEPTO_SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Jhaveri Securities}
      PORTAL_BASE: ${PORTAL_BASE:-https://${PRETIX_DOMAIN}}
      QR_BASE: ${QR_BASE:-https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=20&data=}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8090}:8090"
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  pretix:
    image: pretix/standalone:stable
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # "all" runs nginx + gunicorn + the celery worker under supervisord.
    # On a host whose kernel has no IPv6, the bundled nginx cannot bind [::]:80
    # and crash-loops silently while gunicorn and celery stay healthy, so
    # nothing answers on port 80. Add docker-compose.no-ipv6.yml in that case.
    command: ["all"]
    environment:
      # pretix reads /etc/pretix/pretix.cfg; these two only affect the container itself.
      TZ: ${TZ:-Asia/Kolkata}
      PRETIX_REDIS_LOCATION: redis://redis:6379/0
    volumes:
      - pretix-data:/data
      - ./pretix/pretix.cfg:/etc/pretix/pretix.cfg:ro
    ports:
      # Bound to loopback: an edge proxy (Caddy below, or the host's own nginx) fronts it.
      - "127.0.0.1:8345:80"
    networks: [internal]

  # Periodic pretix jobs (expiring carts, scheduled emails, cleanup).
  # pretix ships no internal scheduler; the documented way is to run `pretix cron`
  # every 15-45 minutes from outside. This sidecar does that without a host crontab
  # and without mounting the Docker socket.
  pretix-cron:
    image: pretix/standalone:stable
    restart: unless-stopped
    depends_on:
      pretix: {condition: service_started}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - 'while true; do sleep ${PRETIX_CRON_INTERVAL:-900}; pretix cron || echo "pretix cron failed at $$(date -Is)"; done'
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - pretix-data:/data
      - ./pretix/pretix.cfg:/etc/pretix/pretix.cfg:ro
    networks: [internal]

  n8n:
    build:
      context: ./n8n
    image: jsl-events/n8n:local
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}

      N8N_HOST: ${N8N_DOMAIN:?set N8N_DOMAIN in .env}
      N8N_PORT: 5678
      # n8n listens on :: by default and exits with "address '::' is not
      # available" on a host without IPv6. The reverse proxy reaches it over
      # IPv4 on the compose network either way.
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}

      # Encrypts stored credentials. Losing it means re-entering every credential.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}

      GENERIC_TIMEZONE: ${TZ:-Asia/Kolkata}
      TZ: ${TZ:-Asia/Kolkata}

      # W1 and W6 sign broker links with HMAC-SHA256. Node's crypto module is not
      # available in the Code node unless it is allowlisted here.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # Ticket QR rendering. Installed in deploy/n8n/Dockerfile.
      NODE_FUNCTION_ALLOW_EXTERNAL: qrcode
      N8N_RUNNERS_ENABLED: "true"

      # WhatsApp status webhooks are high volume. Keep only what is useful.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTION_RETENTION_HOURS:-720}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${N8N_SAVE_ON_SUCCESS:-all}

      N8N_DIAGNOSTICS_ENABLED: "false"
      # n8n blocks $env in Code nodes and expressions by default, and the
      # failure is a bare "access to env vars denied" in the log with nothing
      # shown in the UI. The workflows read PRETIX_API_BASE and the broker link
      # secret this way. Acceptable here because the instance is single-tenant
      # and only we author workflows; on a shared instance it would not be,
      # since any Code node could then read the database password.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      # Signs each broker's personal registration link so the broker code in
      # the URL cannot be edited to register under someone else's name.
      BROKER_LINK_SECRET: ${BROKER_LINK_SECRET:?set BROKER_LINK_SECRET in .env}
      # Where the workflows reach pretix on the internal network.
      PRETIX_API_BASE: ${PRETIX_API_BASE:-http://pretix:80/api/v1}
      # pretix validates the Host header against its configured url and answers
      # 400 "Unknown host" to anything else. Reaching it as http://pretix on the
      # compose network sends Host: pretix, so every request must override it.
      PRETIX_HOST: ${PRETIX_HOST:-${PRETIX_DOMAIN}}
      PRETIX_ORGANIZER: ${PRETIX_ORGANIZER:-jsl}
      PRETIX_EVENT: ${PRETIX_EVENT:-investor-events}
    volumes:
      - n8n-data:/home/node/.n8n
      - n8n-files:/files
    ports:
      - "127.0.0.1:5678:5678"
    networks: [internal]

  # Only started with: docker compose --profile edge up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    depends_on: [pretix, n8n]
    environment:
      PRETIX_DOMAIN: ${PRETIX_DOMAIN:?set PRETIX_DOMAIN in .env}
      N8N_DOMAIN: ${N8N_DOMAIN:?set N8N_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    networks: [internal]

volumes:
  postgres-data:
  redis-data:
  pretix-data:
  n8n-data:
  n8n-files:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
